<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04050A">
<title>Feedback — Mzantsified</title>
<meta name="description" content="Tell us what works and what doesn't on Mzantsified or Ad//Intel.">
<link rel="icon" href="assets/mzantsified-icon-192.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#04050A;color:#F4F4F2;font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:520px;margin:0 auto;padding:24px 16px 48px}
header{display:flex;align-items:center;gap:10px;margin-bottom:20px}
header img{width:36px;height:36px;border-radius:8px}
header a{color:#FFB612;font-weight:700;text-decoration:none}
.switch{display:flex;gap:8px;margin:0 0 16px}
.switch a{flex:1;text-align:center;padding:10px;border-radius:999px;border:1px solid #2A2C35;color:#F4F4F2;text-decoration:none;font-weight:600;font-size:14px;min-height:44px;display:flex;align-items:center;justify-content:center}
.switch a[aria-current=page]{background:#FFB612;color:#1A1204;border-color:#FFB612}
footer{margin-top:24px;color:#6B6D75;font-size:12px;text-align:center}
</style>
</head>
<body>
<main>
  <header><img src="assets/mzantsified-icon-192.webp" alt=""><a href="/">Mzantsified</a></header>
  <nav class="switch" aria-label="Choose product">
    <a id="t-mz" href="?product=mzantsified">Mzantsified</a>
    <a id="t-ai" href="?product=adintel">Ad//Intel</a>
  </nav>
  <div id="form"></div>
  <footer>Solutions Sinazo (Pty) Ltd · Your feedback is used only to improve our products.</footer>
</main>
<script>
  (function () {
    var p = new URLSearchParams(location.search).get('product') === 'adintel' ? 'adintel' : 'mzantsified';
    document.getElementById(p === 'adintel' ? 't-ai' : 't-mz').setAttribute('aria-current', 'page');
    document.title = 'Feedback — ' + (p === 'adintel' ? 'Ad//Intel' : 'Mzantsified');
    var s = document.createElement('script');
    s.src = '/feedback.js';
    s.setAttribute('data-product', p);
    s.setAttribute('data-inline', '#form');
    s.setAttribute('data-button', 'off');
    s.setAttribute('data-popup', 'off');
    document.body.appendChild(s);
  })();
</script>
</body>
</html>
